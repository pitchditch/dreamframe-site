name: D2D route check

on:
  pull_request:
    paths:
      - 'src/components/house-tracking/**'
      - 'src/hooks/useGoogleMapsRouting.ts'
      - 'src/pages/crm/RouteHistory.tsx'
      - 'src/utils/d2dCloud.ts'
      - 'src/utils/d2dRouteBus.ts'
      - 'src/utils/d2dRouteRuntime.ts'
      - 'src/utils/d2dSyncStatus.ts'
      - 'src/utils/routeOptimizer.ts'
      - 'supabase/migrations/**'
      - 'tests/d2d-route-runtime.test.ts'
      - 'tsconfig.d2d-routes.json'
      - 'tsconfig.d2d-tests.json'
      - '.github/workflows/d2d-route-check.yml'

permissions:
  contents: read

jobs:
  build-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx tsc -p tsconfig.d2d-routes.json --noEmit
      - name: Run D2D route runtime tests
        run: |
          node -e "require('fs').rmSync('.d2d-test-build',{recursive:true,force:true})"
          npx tsc -p tsconfig.d2d-tests.json
          node --test .d2d-test-build/tests/d2d-route-runtime.test.js
